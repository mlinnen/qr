<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Redirecting...</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        background: #f4f6f8;
        color: #111;
      }
      .card {
        width: min(34rem, calc(100% - 2rem));
        background: #fff;
        border-radius: 0.75rem;
        padding: 1.25rem;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0.5rem 0;
        line-height: 1.5;
      }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
      }
      .status::before {
        content: "";
        width: 0.8rem;
        height: 0.8rem;
        border: 2px solid #a4adba;
        border-top-color: #1769e0;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      a {
        color: #1769e0;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Taking you there...</h1>
      <p class="status" id="status" role="status" aria-live="polite">Preparing your redirect.</p>
      <p>
        If you are not redirected automatically,
        <a id="manual-link" href="https://minthillevents.org/">click here</a>.
      </p>
      <noscript>
        <p>
          JavaScript is disabled.
          <a href="https://minthillevents.org/">Click here to proceed</a>.
        </p>
      </noscript>
    </main>
    <script>
      (function () {
        const manualLink = document.getElementById("manual-link");
        const ALLOWED_DESTINATIONS = [
          { origin: "https://minthillevents.org", pathPrefix: "/" },
          { origin: "https://docs.google.com", pathPrefix: "/forms/" }
        ];
        const CONFIG = {
          routes: {
            scarecrow: "https://docs.google.com/forms/d/e/example/viewform"
          }
        };

        const status = document.getElementById("status");

        function findAlias(searchParams) {
          for (const [key, value] of searchParams.entries()) {
            const lower = key.trim().toLowerCase();
            if (lower === "to" || lower === "id") {
              return value.trim().toLowerCase();
            }
          }
          return "";
        }

        function isValidDestination(url) {
          try {
            const parsed = new URL(url);
            if (parsed.protocol !== "https:") {
              return false;
            }
            return ALLOWED_DESTINATIONS.some(function (rule) {
              return parsed.origin === rule.origin && parsed.pathname.startsWith(rule.pathPrefix);
            });
          } catch (_error) {
            return false;
          }
        }

        const alias = findAlias(new URLSearchParams(window.location.search));
        const defaultUrl = isValidDestination(manualLink.href) ? manualLink.href : "";
        if (!defaultUrl) {
          status.textContent = "Redirect configuration error.";
          manualLink.removeAttribute("href");
          return;
        }

        const routeTarget = alias ? CONFIG.routes[alias] : "";
        const hasRoute = Boolean(alias) && Object.prototype.hasOwnProperty.call(CONFIG.routes, alias);
        const hasValidRoute = hasRoute && isValidDestination(routeTarget);
        const destination = hasValidRoute ? routeTarget : defaultUrl;

        if (hasValidRoute) {
          status.textContent = "Redirecting you now.";
        } else if (hasRoute) {
          status.textContent = "Alias target is unavailable. Sending you to the default page.";
        } else if (alias) {
          status.textContent = "Alias not found. Sending you to the default page.";
        } else {
          status.textContent = "No alias provided. Sending you to the default page.";
        }

        manualLink.href = destination;
        window.setTimeout(function () {
          window.location.replace(destination);
        }, 3000);
      })();
    </script>
  </body>
</html>
